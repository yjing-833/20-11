<body>

      </g>
      <g transform="translate(130 74) scale(.8)">
        <circle cx="0" cy="-7" r="6.5" fill="#eab4ab" opacity=".75"/>
        <circle cx="6.7" cy="-2.2" r="6.5" fill="#e3a59b" opacity=".75"/>
        <circle cx="4.1" cy="5.7" r="6.5" fill="#eab4ab" opacity=".75"/>

  <main class="page">
    <header class="cover">
      <p class="cover-date" id="cover-date">20 tháng 11</p>
      <h1 class="cover-title" id="cover-title">Gửi em</h1>
    </header>

    <div class="envelope" id="envelope">
      <div class="env-back" aria-hidden="true"></div>

      <article class="letter" id="letter" tabindex="-1" aria-label="Lá thư">
        <p class="letter-date" id="letter-date">Ngày 20 tháng 11</p>
        <figure class="letter-photo" id="letter-photo" hidden></figure>
        <div class="letter-body" id="letter-body">
          <p>Chúc em một ngày 20/11 thật vui. Anh mong em luôn tìm thấy niềm vui trong nghề mình yêu. Anh tự hào về em và thương em nhiều!</p>
        </div>
        <p class="letter-sign">
          <span class="letter-closing" id="letter-closing">Thương em,</span>
          <span class="letter-name" id="letter-name">Anh</span>
        </p>
      </article>

      <div class="env-front" aria-hidden="true"></div>
      <div class="env-flap" aria-hidden="true">
        <div class="env-flap-shape"></div>
        <span class="env-seal">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" fill="currentColor"/></svg>
        </span>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="open-btn" id="open-btn" aria-controls="letter" aria-expanded="false" hidden>Mở thư</button>
    </div>
  </main>

  <script src="content.js"></script>
  <script src="script.js"></script>
